services:
  wallkalender:
    build: .
    env_file: .env
    environment:
      PORT: "8080"
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ./data:/data   # teams.ics, theme.css, termine.txt (the form writes it)
    restart: unless-stopped

  # optional: docker compose --profile teams up -d
  teams:
    build: .
    profiles: [teams]
    env_file: .env
    command: ["python", "teams_ics.py", "-o", "/data/teams.ics"]
    volumes:
      - ./data:/data
    restart: unless-stopped
